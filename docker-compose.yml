version: '3.8'

services:
  # ----- MongoDB Database -----------------------
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: workzone
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ------  Backend API --------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/workzone
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # -------- Frontend ------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  network:
    driver: bridge

volumes:
  mongodb_data:
    name: mongodb_data